services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cpublishr
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: ../../backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [../env/backend.env.example]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
